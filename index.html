<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handyman Express - Estilo inDrive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS (Mapas Interactivos Gratis) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 320px; width: 100%; border-radius: 1rem; z-index: 1; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- Navegación Principal -->
    <nav class="bg-blue-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">⚡ Handyman Express</h1>
            <div class="flex gap-2 text-sm font-semibold">
                <button onclick="switchTab('request')" id="btn-request" class="px-3 py-2 rounded-lg bg-blue-700 text-white transition">Solicitar</button>
                <button onclick="switchTab('techs')" id="btn-techs" class="px-3 py-2 rounded-lg hover:bg-blue-800 text-blue-200 transition">Técnicos</button>
                <button onclick="switchTab('jobs')" id="btn-jobs" class="px-3 py-2 rounded-lg hover:bg-blue-800 text-blue-200 transition flex items-center gap-1">
                    Mis Pedidos <span id="job-badge" class="bg-amber-500 text-gray-900 text-xs px-2 py-0.5 rounded-full font-bold hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-4xl mx-auto p-4 flex-grow w-full">

        <!-- 1. PESTAÑA: SOLICITAR CON MAPA INTERACTIVO -->
        <section id="tab-request" class="space-y-6">
            
            <!-- CONTENEDOR DEL MAPA EN VIVO -->
            <div class="bg-white p-4 rounded-2xl shadow-md border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <div>
                        <h3 class="font-bold text-gray-900 flex items-center gap-2">📍 Mapa de Cobertura en Vivo</h3>
                        <p class="text-xs text-gray-500">Ubicación detectada y técnicos disponibles en tu zona</p>
                    </div>
                    <button onclick="getUserLocation()" class="bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1.5 rounded-lg hover:bg-blue-200 transition">
                        🎯 Mi Ubicación
                    </button>
                </div>
                <!-- El mapa se renderiza dentro de este DIV -->
                <div id="map"></div>
            </div>

            <!-- FORMULARIO DE SOLICITUD -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold text-blue-900 mb-4">🚗 Configura tu Pedido</h2>

                <form id="orderForm" class="space-y-4">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre del Cliente</label>
                            <input type="text" id="clientName" required placeholder="Ej. Carlos Mendoza" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Zona / Sector</label>
                            <select id="locationZone" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="0" data-name="Panamá Centro">Panamá Centro (Sin recargo)</option>
                                <option value="5" data-name="San Miguelito">San Miguelito (+$5.00 transporte)</option>
                                <option value="10" data-name="Panamá Oeste">Panamá Oeste / Arraiján (+$10.00 transporte)</option>
                                <option value="8" data-name="Panamá Este">Panamá Este / Tocumen (+$8.00 transporte)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Especialidad Requerida</label>
                            <select id="serviceCategory" onchange="filterTechsByCategory()" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="Plomería">🚰 Plomería ($25 tarifa base)</option>
                                <option value="Electricidad">⚡ Electricidad ($30 tarifa base)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Seleccionar Técnico Cercano</label>
                            <select id="selectedTech" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <!-- Se llena dinámicamente con JS -->
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Detalle del Trabajo</label>
                        <textarea id="jobDetail" rows="2" placeholder="Describe brevemente el problema técnico..." class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" required></textarea>
                    </div>

                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 flex justify-between items-center">
                        <div>
                            <span class="text-xs text-gray-500 block uppercase font-bold">Tarifa Estimada</span>
                            <span class="text-xs text-gray-400">Servicio + Movilización</span>
                        </div>
                        <span id="displayTotal" class="text-3xl font-black text-blue-900">$25.00</span>
                    </div>

                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-gray-900 py-3 rounded-xl font-bold text-lg shadow-lg transition transform active:scale-95">
                        🚀 Invocar Técnico Cercano
                    </button>
                </form>
            </div>
        </section>

        <!-- 2. PESTAÑA: DIRECTORIO DE TÉCNICOS -->
        <section id="tab-techs" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-blue-900">👥 Técnicos Activos en el Radar</h2>
            <div id="techsGrid" class="grid md:grid-cols-2 gap-4"></div>
        </section>

        <!-- 3. PESTAÑA: HISTORIAL DE PEDIDOS -->
        <section id="tab-jobs" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-blue-900">📋 Pedidos Activos</h2>
            <div id="jobsList" class="space-y-3">
                <div class="bg-white p-8 text-center rounded-2xl border border-gray-200 text-gray-400">
                    Aún no has solicitado ningún técnico en el mapa.
                </div>
            </div>
        </section>

    </main>

    <!-- Leaflet JS (Librería de Mapas) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // BASE DE DATOS DE TÉCNICOS CON COORDENADAS (Cercanas a Panamá)
        const technicians = [
            { id: 1, name: "Roberto Gómez", category: "Plomería", rating: "4.9 ⭐", jobsDone: 142, status: "Disponible", photo: "👨‍🔧", lat: 8.9920, lng: -79.5180 },
            { id: 2, name: "Carlos Rodríguez", category: "Electricidad", rating: "5.0 ⭐", jobsDone: 98, status: "Disponible", photo: "🧑‍🔧", lat: 8.9800, lng: -79.5250 },
            { id: 3, name: "Javier López", category: "Plomería", rating: "4.8 ⭐", jobsDone: 76, status: "En Ruta", photo: "👨‍🏭", lat: 8.9700, lng: -79.5050 },
            { id: 4, name: "Miguel Ángel", category: "Electricidad", rating: "4.9 ⭐", jobsDone: 115, status: "Disponible", photo: "👷‍♂️", lat: 9.0050, lng: -79.5100 }
        ];

        let myOrders = [];
        let map;
        let userMarker;
        let techMarkers = [];

        // Coordenadas por defecto (Ciudad de Panamá)
        let userLat = 8.9824;
        let userLng = -79.5199;

        // INICIALIZACIÓN DEL MAPA
        function initMap() {
            map = L.map('map').setView([userLat, userLng], 13);

            // Capa de mapa libre de OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Marcar ubicación inicial del usuario
            setUserMarker(userLat, userLng, "📍 Tu Ubicación Actual");

            // Marcar técnicos alrededor
            renderTechMarkers();
        }

        // Marcar/Actualizar la ubicación del usuario
        function setUserMarker(lat, lng, title) {
            if (userMarker) map.removeLayer(userMarker);

            userMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>${title}</b>`)
                .openPopup();

            map.setView([lat, lng], 13);
        }

        // Usar Geolocalización del Navegador
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;
                        setUserMarker(userLat, userLng, "📍 Tu Ubicación (GPS Detectado)");
                    },
                    () => {
                        alert("No se pudo obtener el GPS automático. Mostrando ubicación predeterminada en Panamá.");
                    }
                );
            }
        }

        // Renderizar marcadores de técnicos tipo inDrive en el Mapa
        function renderTechMarkers() {
            // Limpiar marcadores viejos
            techMarkers.forEach(m => map.removeLayer(m));
            techMarkers = [];

            technicians.forEach(tech => {
                const marker = L.marker([tech.lat, tech.lng]).addTo(map)
                    .bindPopup(`
                        <div style="text-align:center;">
                            <b style="font-size:14px;">${tech.photo} ${tech.name}</b><br>
                            <span style="color:#2563eb; font-weight:bold;">${tech.category}</span><br>
                            <small>${tech.rating} • ${tech.status}</small>
                        </div>
                    `);
                techMarkers.push(marker);
            });
        }

        // Pestañas (SPA)
        function switchTab(tabName) {
            ['request', 'techs', 'jobs'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`btn-${tab}`).classList.remove('bg-blue-700', 'text-white');
                document.getElementById(`btn-${tab}`).classList.add('text-blue-200');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`btn-${tabName}`).classList.add('bg-blue-700', 'text-white');

            if (tabName === 'request') {
                setTimeout(() => map.invalidateSize(), 200); // Recalcular tamaño del mapa
            }
        }

        // Directorio de técnicos
        function renderTechs() {
            const container = document.getElementById('techsGrid');
            container.innerHTML = technicians.map(tech => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="text-4xl bg-blue-50 p-3 rounded-2xl">${tech.photo}</span>
                        <div>
                            <h3 class="font-bold text-gray-900">${tech.name}</h3>
                            <p class="text-xs text-gray-500">${tech.category} • ${tech.jobsDone} trabajos</p>
                            <span class="text-xs font-bold ${tech.status === 'Disponible' ? 'text-green-600' : 'text-amber-600'}">${tech.status}</span>
                        </div>
                    </div>
                    <span class="text-sm font-bold text-amber-500">${tech.rating}</span>
                </div>
            `).join('');
        }

        // Filtrar selector
        function filterTechsByCategory() {
            const cat = document.getElementById('serviceCategory').value;
            const filtered = technicians.filter(t => t.category === cat);
            const select = document.getElementById('selectedTech');
            select.innerHTML = filtered.map(t => `<option value="${t.name}">${t.name} (${t.rating})</option>`).join('');
            calculateCost();
        }

        // Cálculo de tarifa
        function calculateCost() {
            const baseCost = document.getElementById('serviceCategory').value === 'Plomería' ? 25 : 30;
            const travelCost = parseFloat(document.getElementById('locationZone').value);
            const total = baseCost + travelCost;
            document.getElementById('displayTotal').textContent = `$${total.toFixed(2)}`;
            return total;
        }

        document.getElementById('locationZone').addEventListener('change', calculateCost);
        document.getElementById('serviceCategory').addEventListener('change', calculateCost);

        // Envío del Pedido
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const zoneSelect = document.getElementById('locationZone');
            const newOrder = {
                id: Date.now().toString().slice(-4),
                client: document.getElementById('clientName').value,
                zone: zoneSelect.options[zoneSelect.selectedIndex].getAttribute('data-name'),
                category: document.getElementById('serviceCategory').value,
                tech: document.getElementById('selectedTech').value,
                detail: document.getElementById('jobDetail').value,
                cost: calculateCost(),
                status: "Técnico asignado en mapa 🚗",
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            myOrders.unshift(newOrder);
            updateOrdersUI();
            switchTab('jobs');
            this.reset();
            calculateCost();
        });

        function updateOrdersUI() {
            const badge = document.getElementById('job-badge');
            const jobsList = document.getElementById('jobsList');

            if (myOrders.length > 0) {
                badge.textContent = myOrders.length;
                badge.classList.remove('hidden');

                jobsList.innerHTML = myOrders.map(order => `
                    <div class="bg-white p-5 rounded-2xl shadow-md border-l-4 border-amber-500 flex justify-between items-center">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-xs font-bold bg-blue-100 text-blue-900 px-2 py-0.5 rounded">Pedido #${order.id}</span>
                                <span class="text-xs text-gray-400">${order.date}</span>
                            </div>
                            <h4 class="font-bold text-gray-900">${order.category} con ${order.tech}</h4>
                            <p class="text-xs text-gray-600">📍 ${order.zone} • ${order.detail}</p>
                            <span class="inline-block mt-2 text-xs font-bold text-green-600 bg-green-50 px-2.5 py-1 rounded-full">${order.status}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-extrabold text-blue-900 block">$${order.cost.toFixed(2)}</span>
                            <a href="https://wa.me/50760000000?text=Hola,%20seguimiento%20al%20pedido%20%23${order.id}" target="_blank" class="inline-block mt-2 text-xs bg-green-500 text-white font-bold px-3 py-1.5 rounded-lg hover:bg-green-600 transition">
                                💬 Contactar
                            </a>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Carga inicial
        window.onload = () => {
            initMap();
            renderTechs();
            filterTechsByCategory();
        };
    </script>
</body>
</html>
